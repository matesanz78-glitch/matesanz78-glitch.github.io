<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MULTA TEAM</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#f3f6f9;color:#132238}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}aside{width:240px;background:#102f53;color:#fff;padding:22px 14px;position:fixed;inset:0 auto 0 0}.brand{font-size:20px;font-weight:900;padding:8px 12px 28px}.brand small{display:block;font-size:10px;color:#9db0c5;margin-top:4px}nav button{width:100%;text-align:left;background:none;border:0;color:#c6d3df;padding:12px;border-radius:9px;margin:2px 0}nav button.active,nav button:hover{background:#1f4b76;color:#fff}main{margin-left:240px;width:calc(100% - 240px)}header{height:72px;background:#fff;border-bottom:1px solid #e2e8ee;display:flex;align-items:center;gap:12px;padding:0 26px;position:sticky;top:0;z-index:5}header b{margin-right:auto}.content{padding:28px;max-width:1450px;margin:auto}.primary,.secondary,.danger{border:0;border-radius:9px;padding:10px 14px;font-weight:700}.primary{background:#153e69;color:#fff}.secondary{background:#fff;border:1px solid #d7e0e8;color:#153e69}.danger{background:#feeceb;color:#b42318}h1{font-size:27px;margin:0 0 4px}.sub{color:#718096;margin:0 0 20px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:#fff;border:1px solid #e5eaf0;border-radius:14px;box-shadow:0 3px 16px #102f5308}.card{padding:18px}.card small{color:#718096}.card strong{font-size:23px;display:block;margin-top:10px}.panel{padding:20px;margin-top:18px}.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}.bars{height:270px;display:flex;align-items:end;gap:10px;border-bottom:1px solid #ccd6df;padding-top:20px}.bar{flex:1;background:#183f6b;border-radius:7px 7px 0 0;min-height:2px;position:relative}.bar span{position:absolute;bottom:-23px;width:100%;text-align:center;font-size:10px;color:#748295}.rank>div,.fine-row{display:flex;align-items:center;gap:12px;padding:12px 5px;border-bottom:1px solid #eef1f4}.rank i{width:28px;height:28px;border-radius:50%;background:#edf3f8;display:grid;place-items:center;font-style:normal}.rank span,.fine-row span{flex:1}.rank small,.fine-row small{display:block;color:#7b8795}.badge{padding:5px 9px;border-radius:15px;font-size:11px;font-weight:700}.ok{background:#e7f8ef;color:#13734a}.wait{background:#fff0e8;color:#b54708}.toolbar{display:flex;gap:12px;margin:18px 0}.toolbar input{flex:1;max-width:520px}.toolbar input,.toolbar select,.form input,.form select,.form textarea,header select{border:1px solid #d5dee7;border-radius:9px;padding:10px;background:#fff}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px;border-bottom:1px solid #edf1f4}th{font-size:11px;color:#657487;background:#f8fafb}.actions button{border:0;padding:7px;border-radius:6px;margin:2px}.players{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.player{background:#fff;border:1px solid #e3e9ef;border-radius:14px;padding:17px}.avatar{width:45px;height:45px;border-radius:50%;background:#173f6b;color:#fff;display:grid;place-items:center;font-weight:800}.playerhead{display:flex;align-items:center;gap:12px}.pstats{display:flex;margin-top:15px;border-top:1px solid #edf1f4;padding-top:12px}.pstats span{flex:1}.pstats small{display:block;color:#788595}.overlay{position:fixed;inset:0;background:#071a2d99;display:grid;place-items:center;z-index:20;padding:15px}.modal{background:#fff;width:min(560px,100%);border-radius:16px;padding:22px}.modalhead{display:flex;justify-content:space-between}.form{display:grid;gap:13px}.form label{display:grid;gap:6px;font-size:12px;font-weight:650}.form textarea{min-height:80px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modalfoot{display:flex;justify-content:flex-end;gap:10px}.toast{position:fixed;right:22px;bottom:22px;background:#163e69;color:#fff;padding:13px 17px;border-radius:9px;z-index:30}.hidden{display:none!important}.reason-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px}.calendar{display:grid;grid-template-columns:repeat(7,1fr)}.day{min-height:95px;border:1px solid #edf1f4;padding:8px}.day em{display:block;background:#feeceb;color:#b42318;margin-top:5px;padding:3px;border-radius:4px;font-size:10px}#menu{display:none}@media(max-width:800px){aside{transform:translateX(-100%);z-index:10;transition:.2s}aside.open{transform:none}main{margin:0;width:100%}#menu{display:block}.content{padding:16px}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.players{grid-template-columns:1fr}.tablepanel{overflow:auto}header .primary{font-size:0}header .primary:after{content:'+';font-size:20px}.row2{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside id="side"><div class="brand">⚽ MULTA TEAM<small>GESTIÓN DE EQUIPO</small></div><nav id="nav"></nav></aside><main><header><button id="menu" class="secondary">☰</button><b id="teamTitle">Atlético Central</b><select id="season"><option>2026/2027</option><option>2025/2026</option></select><button class="primary" onclick="openFine()">＋ Nueva multa</button></header><div id="view" class="content"></div></main></div><div id="modal"></div><div id="toast" class="toast hidden"></div><script>
const reasons=['Llegar tarde','No acudir a entrenamiento','No llevar equipación','Tarjeta roja','No avisar','Llegar tarde al partido','Material olvidado','Comportamiento','Otros'];
const seed=()=>{let players=['Carlos Martín','Miguel Torres','Sergio Ruiz','Álvaro García','Javier Moreno','Pablo Santos','Daniel López','Hugo Pérez','Iván Romero','Marcos Díaz','Adrián Vega','Rubén Alonso'].map((name,i)=>({id:'p'+i,name,number:i+1,position:['Portero','Defensa','Centrocampista','Delantero'][i%4],active:true}));let rs=reasons.map((name,i)=>({id:'r'+i,name,description:'Motivo configurable',amount:[5,15,10,25,10,20,5,20,5][i],color:['#f59e0b','#ef4444','#8b5cf6','#dc2626','#06b6d4','#f97316','#64748b','#ec4899','#10b981'][i]}));let fines=Array.from({length:42},(_,i)=>({id:'f'+i,playerId:'p'+i%12,reasonId:'r'+i%9,amount:rs[i%9].amount+(i%4==0?5:0),date:`2026-${String(i%9+1).padStart(2,'0')}-${String(i*3%25+1).padStart(2,'0')}`,status:i%3?'Pagada':'Pendiente',paidAt:i%3?'2026-09-20':'',notes:i%5?'':'Notificada al jugador'}));return{team:'Atlético Central',players,reasons:rs,fines}};
let S;try{S=JSON.parse(localStorage.getItem('multaTeam'))||seed()}catch{S=seed()}let page='Dashboard';const euro=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n),fmt=d=>d?new Date(d+'T12:00').toLocaleDateString('es-ES'):'—',uid=()=>crypto.randomUUID(),save=()=>{localStorage.setItem('multaTeam',JSON.stringify(S));render()},player=id=>S.players.find(x=>x.id==id),reason=id=>S.reasons.find(x=>x.id==id),toast=t=>{let x=document.querySelector('#toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),2000)};
const pages=['Dashboard','Multas','Jugadores','Pagos','Estadísticas','Motivos','Calendario','Configuración'];nav.innerHTML=pages.map(x=>`<button onclick="go('${x}')">${x}</button>`).join('');menu.onclick=()=>side.classList.toggle('open');function go(x){page=x;side.classList.remove('open');render()}
function totals(){let total=S.fines.reduce((a,f)=>a+f.amount,0),paid=S.fines.filter(f=>f.status=='Pagada').reduce((a,f)=>a+f.amount,0);return{total,paid,pending:total-paid,count:S.fines.length}}function ranks(){return S.players.map(p=>{let f=S.fines.filter(x=>x.playerId==p.id),total=f.reduce((a,x)=>a+x.amount,0),paid=f.filter(x=>x.status=='Pagada').reduce((a,x)=>a+x.amount,0);return{...p,count:f.length,total,paid,pending:total-paid}}).sort((a,b)=>b.total-a.total)}function months(){return Array.from({length:12},(_,i)=>{let f=S.fines.filter(x=>+x.date.slice(5,7)==i+1);return{name:['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'][i],value:f.reduce((a,x)=>a+x.amount,0),count:f.length}})}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.textContent==page));teamTitle.textContent=S.team;view.innerHTML=({Dashboard:dashboard,Multas:finesPage,Jugadores:playersPage,Pagos:payments,Estadísticas:stats,Motivos:reasonsPage,Calendario:calendar,Configuración:settings}[page])()}
function title(a,b){return `<h1>${a}</h1><p class="sub">${b}</p>`}function dashboard(){let t=totals(),r=ranks(),m=months(),max=Math.max(...m.map(x=>x.value),1);return title('Panel del equipo','Resumen de actividad y recaudación')+`<div class="cards">${[['Total multas',t.count],['Dinero generado',euro(t.total)],['Cobrado',euro(t.paid)],['Pendiente',euro(t.pending)]].map(x=>`<div class="card"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div><div class="grid"><section class="panel"><h2>Evolución de multas</h2><div class="bars">${m.map(x=>`<div title="${x.count} multas · ${euro(x.value)}" class="bar" style="height:${x.value/max*90}%"><span>${x.name}</span></div>`).join('')}</div></section><section class="panel"><h2>Jugadores con más multas</h2><div class="rank">${r.slice(0,7).map((x,i)=>`<div><i>${i+1}</i><span><b>${x.name}</b><small>${x.count} multas</small></span><strong>${euro(x.total)}</strong></div>`).join('')}</div></section></div><div class="grid"><section class="panel"><h2>Motivos frecuentes</h2>${S.reasons.map(x=>{let f=S.fines.filter(y=>y.reasonId==x.id);return `<div class="fine-row"><span><i class="reason-dot" style="background:${x.color}"></i>${x.name}</span><b>${f.length}</b><strong>${euro(f.reduce((a,y)=>a+y.amount,0))}</strong></div>`}).join('')}</section><section class="panel"><h2>Últimas multas</h2>${fineRows(S.fines.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7))}</section></div>`}
function fineRows(list,actions=false){return list.map(f=>`<div class="fine-row"><span><b>${player(f.playerId)?.name}</b><small>${reason(f.reasonId)?.name} · ${fmt(f.date)}</small></span><strong>${euro(f.amount)}</strong><i class="badge ${f.status=='Pagada'?'ok':'wait'}">${f.status}</i>${actions?`<button onclick="openFine('${f.id}')">✎</button>${f.status=='Pendiente'?`<button onclick="pay('${f.id}')">✓</button>`:''}<button onclick="delFine('${f.id}')">🗑</button>`:''}</div>`).join('')}
function finesPage(){return title('Multas','Historial completo')+`<div class="toolbar"><input id="q" oninput="filterFines()" placeholder="Buscar jugador, motivo u observaciones"><select id="st" onchange="filterFines()"><option>Todos</option><option>Pendiente</option><option>Pagada</option></select><button class="secondary" onclick="exportCSV()">Exportar CSV</button></div><section class="panel" id="fineList">${fineRows(S.fines,true)}</section>`}function filterFines(){let q=document.querySelector('#q').value.toLowerCase(),st=document.querySelector('#st').value,l=S.fines.filter(f=>(player(f.playerId).name+' '+reason(f.reasonId).name+' '+f.notes).toLowerCase().includes(q)&&(st=='Todos'||f.status==st));fineList.innerHTML=fineRows(l,true)||'<p>Sin resultados.</p>'}
function playersPage(){return title('Jugadores',`${S.players.length} integrantes`)+`<div class="toolbar"><button class="primary" onclick="openPlayer()">＋ Añadir jugador</button></div><div class="players">${ranks().map(p=>`<div class="player"><div class="playerhead"><div class="avatar">${p.name.split(' ').map(x=>x[0]).join('').slice(0,2)}</div><span><b>${p.name}</b><small><br>#${p.number} · ${p.position}</small></span></div><div class="pstats"><span><small>Multas</small><b>${p.count}</b></span><span><small>Total</small><b>${euro(p.total)}</b></span><span><small>Pendiente</small><b>${euro(p.pending)}</b></span></div><button class="secondary" onclick="openPlayer('${p.id}')">Editar</button></div>`).join('')}</div>`}
function payments(){let l=S.fines.filter(x=>x.status=='Pendiente');return title('Pagos',`${l.length} pendientes · ${euro(l.reduce((a,x)=>a+x.amount,0))}`)+`<section class="panel">${fineRows(l,true)||'<p>No hay pagos pendientes.</p>'}</section>`}
function stats(){let m=months(),r=ranks(),max=Math.max(...r.map(x=>x.total),1),t=totals();return title('Estadísticas','Análisis de la temporada')+`<div class="grid"><section class="panel"><h2>Dinero por mes</h2>${m.map(x=>`<div class="fine-row"><span>${x.name}</span><div style="width:${x.value/Math.max(...m.map(y=>y.value),1)*55}%;height:12px;background:#173f6b;border-radius:5px"></div><b>${euro(x.value)}</b></div>`).join('')}</section><section class="panel"><h2>Dinero por jugador</h2>${r.map(x=>`<div class="fine-row"><span>${x.name}</span><div style="width:${x.total/max*40}%;height:12px;background:#1f7a61;border-radius:5px"></div><b>${euro(x.total)}</b></div>`).join('')}</section><section class="panel"><h2>Pagado vs pendiente</h2><div class="cards"><div class="card"><small>Pagado</small><strong>${euro(t.paid)}</strong></div><div class="card"><small>Pendiente</small><strong>${euro(t.pending)}</strong></div></div></section></div>`}
function reasonsPage(){return title('Motivos','Importes predeterminados configurables')+`<div class="toolbar"><button class="primary" onclick="openReason()">＋ Crear motivo</button></div><div class="players">${S.reasons.map(r=>`<div class="player"><h3><i class="reason-dot" style="background:${r.color}"></i>${r.name}</h3><p>${r.description}</p><b>${euro(r.amount)}</b><br><br><button class="secondary" onclick="openReason('${r.id}')">Editar</button></div>`).join('')}</div>`}
function calendar(){return title('Calendario','Septiembre 2026')+`<section class="panel calendar">${Array.from({length:30},(_,i)=>{let d=i+1,f=S.fines.filter(x=>x.date==`2026-09-${String(d).padStart(2,'0')}`);return `<div class="day"><b>${d}</b>${f.map(x=>`<em>${player(x.playerId).name} · ${euro(x.amount)}</em>`).join('')}</div>`}).join('')}</section>`}
function settings(){return title('Configuración','Equipo, temporadas y datos')+`<div class="grid"><section class="panel form"><label>Nombre del equipo<input id="team" value="${S.team}"></label><button class="primary" onclick="S.team=team.value;save();toast('Configuración guardada')">Guardar</button></section><section class="panel"><h2>Datos de demostración</h2><p>12 jugadores, 42 multas y 9 motivos.</p><button class="danger" onclick="if(confirm('¿Restablecer todos los datos?')){S=seed();save()}">Restablecer demo</button></section></div>`}
function openFine(id){let f=id?S.fines.find(x=>x.id==id):{id:uid(),playerId:S.players[0].id,reasonId:S.reasons[0].id,amount:S.reasons[0].amount,date:new Date().toISOString().slice(0,10),status:'Pendiente',paidAt:'',notes:''};modal.innerHTML=`<div class="overlay"><div class="modal"><div class="modalhead"><h2>${id?'Editar':'Nueva'} multa</h2><button onclick="closeModal()">✕</button></div><form class="form" onsubmit="saveFine(event,'${id||''}')"><label>Jugador<select id="fp">${S.players.map(x=>`<option value="${x.id}" ${x.id==f.playerId?'selected':''}>${x.name}</option>`)}</select></label><label>Motivo<select id="fr" onchange="fa.value=reason(fr.value).amount">${S.reasons.map(x=>`<option value="${x.id}" ${x.id==f.reasonId?'selected':''}>${x.name}</option>`)}</select></label><div class="row2"><label>Importe (€)<input id="fa" type="number" min="0.01" step="0.01" required value="${f.amount}"></label><label>Fecha<input id="fd" type="date" required value="${f.date}"></label></div><label>Estado<select id="fs"><option ${f.status=='Pendiente'?'selected':''}>Pendiente</option><option ${f.status=='Pagada'?'selected':''}>Pagada</option></select></label><label>Observaciones<textarea id="fn">${f.notes}</textarea></label><div class="modalfoot"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button class="primary">Guardar multa</button></div></form></div></div>`}
function saveFine(e,id){e.preventDefault();let f={id:id||uid(),playerId:fp.value,reasonId:fr.value,amount:+fa.value,date:fd.value,status:fs.value,paidAt:fs.value=='Pagada'?new Date().toISOString().slice(0,10):'',notes:fn.value};S.fines=id?S.fines.map(x=>x.id==id?f:x):[f,...S.fines];closeModal();save();toast('Multa guardada correctamente')}function pay(id){S.fines=S.fines.map(x=>x.id==id?{...x,status:'Pagada',paidAt:new Date().toISOString().slice(0,10)}:x);save();toast('Pago registrado')}function delFine(id){if(confirm('¿Seguro que quieres eliminar esta multa? Esta acción no se puede deshacer.')){S.fines=S.fines.filter(x=>x.id!=id);save();toast('Multa eliminada')}}
function openPlayer(id){let p=id?player(id):{id:uid(),name:'',number:1,position:'Centrocampista',active:true};modal.innerHTML=`<div class="overlay"><div class="modal"><h2>${id?'Editar':'Añadir'} jugador</h2><form class="form" onsubmit="savePlayer(event,'${id||''}')"><label>Nombre y apellidos<input id="pn" required value="${p.name}"></label><div class="row2"><label>Dorsal<input id="pnum" type="number" min="1" value="${p.number}"></label><label>Posición<select id="pp">${['Portero','Defensa','Centrocampista','Delantero'].map(x=>`<option ${x==p.position?'selected':''}>${x}</option>`)}</select></label></div><div class="modalfoot"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button class="primary">Guardar jugador</button></div></form></div></div>`}function savePlayer(e,id){e.preventDefault();let p={id:id||uid(),name:pn.value.trim(),number:+pnum.value,position:pp.value,active:true};S.players=id?S.players.map(x=>x.id==id?p:x):[...S.players,p];closeModal();save();toast('Jugador guardado')}
function openReason(id){let r=id?reason(id):{id:uid(),name:'',description:'',amount:5,color:'#173f6b'};modal.innerHTML=`<div class="overlay"><div class="modal"><h2>${id?'Editar':'Crear'} motivo</h2><form class="form" onsubmit="saveReason(event,'${id||''}')"><label>Nombre<input id="rn" required value="${r.name}"></label><label>Descripción<textarea id="rd">${r.description}</textarea></label><div class="row2"><label>Importe<input id="ra" type="number" value="${r.amount}"></label><label>Color<input id="rc" type="color" value="${r.color}"></label></div><div class="modalfoot"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button class="primary">Guardar motivo</button></div></form></div></div>`}function saveReason(e,id){e.preventDefault();let r={id:id||uid(),name:rn.value,description:rd.value,amount:+ra.value,color:rc.value};S.reasons=id?S.reasons.map(x=>x.id==id?r:x):[...S.reasons,r];closeModal();save();toast('Motivo guardado')}
function closeModal(){modal.innerHTML=''}function exportCSV(){let rows=S.fines.map(f=>[f.date,player(f.playerId).name,reason(f.reasonId).name,f.amount,f.status,f.notes]);let csv='Fecha;Jugador;Motivo;Importe;Estado;Observaciones\n'+rows.map(x=>x.join(';')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='multas.csv';a.click()}render();
</script></body></html>
