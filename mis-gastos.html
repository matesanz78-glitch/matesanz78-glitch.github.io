.shotDrop{border:2px dashed #94a3b8;border-radius:16px;padding:28px;text-align:center;background:var(--soft);transition:.2s}.shotDrop.drag{border-color:#7c3aed;background:#ede9fe}.shotDrop input{display:none}.shotGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:14px}.shotCard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}.shotThumb{width:100%;height:175px;object-fit:cover;background:#111}.shotBody{padding:13px}.shotStatus{display:inline-flex;padding:4px 8px;border-radius:99px;background:var(--soft);font-size:11px;font-weight:800}.shotStatus.ok{background:#dcfce7;color:#166534}.shotStatus.error{background:#fee2e2;color:#991b1b}.shotProgress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0}.shotProgress i{display:block;height:100%;width:0;background:#7c3aed;transition:width .2s}.ocrText{white-space:pre-wrap;max-height:180px;overflow:auto;background:var(--soft);padding:10px;border-radius:10px;font:11px/1.45 ui-monospace,monospace}.ocrReview{border-left:5px solid #7c3aed}.ocrInfo{padding:10px 12px;border-radius:12px;background:#eff6ff;color:#1e40af;margin-bottom:12px}.ocrActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.ocrActions button{padding:9px 11px}.shotPreview{max-width:100%;max-height:65vh;display:block;margin:auto;border-radius:12px}.visionNotice{font-size:12px;color:var(--muted);margin-top:10px}

<script>
'use strict';
const CEXP=[['home','Vivienda','🏠','#6366f1'],['food','Alimentación','🛒','#10b981'],['transport','Transporte','🚗','#3b82f6'],['restaurant','Restaurantes','🍔','#f97316'],['leisure','Ocio','🎮','#8b5cf6'],['shopping','Compras','🛍️','#ec4899'],['health','Salud','💊','#ef4444'],['travel','Viajes','✈️','#06b6d4'],['subscriptions','Suscripciones','📱','#64748b'],['bills','Facturas','💡','#eab308'],['sport','Deporte','⚽','#22c55e'],['gifts','Regalos','🎁','#d946ef'],['education','Educación','📚','#0ea5e9'],['other','Otros','📦','#78716c']].map(x=>({id:x[0],name:x[1],icon:x[2],color:x[3],type:'expense'}));
const CINC=[['salary','Nómina','💼','#10b981'],['extra','Extra','✨','#22c55e'],['sale','Venta','🏷️','#14b8a6'],['investment','Inversión','📈','#06b6d4'],['gift-income','Regalo','🎁','#84cc16'],['other-income','Otros','💰','#65a30d']].map(x=>({id:x[0],name:x[1],icon:x[2],color:x[3],type:'income'}));
const STORES=['transactions','categories','budgets','recurring','goals','settings','bets','betDeposits','betShots'];let DB,state,page='home',selectedDay='';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],uid=()=>crypto.randomUUID(),money=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:state?.settings?.currency||'EUR'}).format(Number(n)||0),today=()=>new Date().toISOString().slice(0,10);
function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open('mis-gastos-single',3);r.onupgradeneeded=()=>{const d=r.result;STORES.forEach(s=>!d.objectStoreNames.contains(s)&&d.createObjectStore(s,{keyPath:s==='settings'?'key':'id'}))};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function req(r){return new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function all(s){return req(DB.transaction(s).objectStore(s).getAll())}async function put(s,v){await req(DB.transaction(s,'readwrite').objectStore(s).put(v))}async function del(s,k){await req(DB.transaction(s,'readwrite').objectStore(s).delete(k))}async function clear(s){await req(DB.transaction(s,'readwrite').objectStore(s).clear())}
async function load(){const [transactions,categories,budgets,recurring,goals,sets,bets,betDeposits,betShots]=await Promise.all(STORES.map(all));state={transactions,categories,budgets,recurring,goals,bets,betDeposits,betShots,settings:sets.find(x=>x.key==='app')?.value||{theme:'system',currency:'EUR',locale:'es-ES',demoLoaded:false}};await processRecurring();applyTheme();render()}
async function seed(){if((await all('categories')).length)return;for(const c of [...CEXP,...CINC])await put('categories',c);const ym=today().slice(0,8),demo=[['income',2000,'Nómina','salary',ym+'01'],['expense',700,'Alquiler','home',ym+'02'],['expense',86.4,'Compra semanal','food',ym+'05'],['expense',35,'Gimnasio','sport',ym+'07'],['expense',19.99,'Streaming','subscriptions',ym+'08']];for(const x of demo)await put('transactions',{id:uid(),type:x[0],amount:x[1],description:x[2],categoryId:x[3],date:x[4],createdAt:new Date().toISOString(),demo:true});await put('settings',{key:'app',value:{theme:'system',currency:'EUR',locale:'es-ES',demoLoaded:true}})}
async function processRecurring(){let changed=false;for(const r of state.recurring.filter(x=>x.active)){let d=new Date((r.lastGenerated||r.startDate)+'T12:00');if(r.lastGenerated)advance(d,r.frequency);while(d<=new Date()){const date=d.toISOString().slice(0,10),id=`rec-${r.id}-${date}`;if(!state.transactions.some(t=>t.id===id)){const t={id,type:r.type,amount:r.amount,description:r.description,categoryId:r.categoryId,date,paymentMethod:r.paymentMethod,notes:r.notes,recurringId:r.id,createdAt:new Date().toISOString()};await put('transactions',t);state.transactions.push(t);changed=true}r.lastGenerated=date;advance(d,r.frequency)}await put('recurring',r)}if(changed)state.transactions=await all('transactions')}function advance(d,f){if(f==='daily')d.setDate(d.getDate()+1);if(f==='weekly')d.setDate(d.getDate()+7);if(f==='monthly')d.setMonth(d.getMonth()+1);if(f==='yearly')d.setFullYear(d.getFullYear()+1)}
function nav(p){page=p;render()}function title(){return({home:'Resumen',movements:'Movimientos',budgets:'Presupuestos',calendar:'Calendario',recurring:'Recurrentes',goals:'Objetivos',stats:'Estadísticas',settings:'Configuración',bets:'Apuestas'})[page]}

function openBetForm(id=''){const b=(state.bets||[]).find(x=>x.id===id)||{date:today(),time:'',sport:'',competition:'',event:'',market:'',selection:'',odds:'',stake:'',result:'Pendiente',book:'',betType:'Simple',notes:''};document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="betModal"><form class="sheet" id="betForm"><header><h2>${id?'Editar apuesta':'Añadir apuesta'}</h2><button type="button" class="icon" onclick="$('#betModal').remove()">✕</button></header><div class="betFormGrid"><label>Fecha<input name="date" type="date" required value="${b.date}"></label><label>Hora<input name="time" type="time" value="${b.time||''}"></label><label>Deporte<input name="sport" required value="${esc(b.sport)}"></label><label>Competición<input name="competition" value="${esc(b.competition||'')}"></label><label>Evento<input name="event" required value="${esc(b.event)}"></label><label>Mercado<input name="market" value="${esc(b.market||'')}"></label><label>Selección<input name="selection" value="${esc(b.selection||'')}"></label><label>Cuota<input name="odds" type="number" inputmode="decimal" min="1.01" step="0.01" required value="${b.odds}"></label><label>Importe apostado<input name="stake" type="number" inputmode="decimal" min="0.01" step="0.01" required value="${b.stake}"></label><label>Resultado<select name="result">${['Ganada','Perdida','Nula','Pendiente'].map(x=>`<option ${x===b.result?'selected':''}>${x}</option>`).join('')}</select></label><label>Casa de apuestas<input name="book" value="${esc(b.book||'')}"></label><label>Tipo<select name="betType"><option ${b.betType==='Simple'?'selected':''}>Simple</option><option ${b.betType==='Múltiple'?'selected':''}>Múltiple</option></select></label><label class="full">Observaciones<textarea name="notes">${esc(b.notes||'')}</textarea></label></div><button class="primary">Guardar apuesta</button></form></div>`);$('#betForm').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.id=id||uid();o.odds=Number(o.odds);o.stake=Number(o.stake);o.createdAt=b.createdAt||new Date().toISOString();await put('bets',o);$('#betModal').remove();toast('Apuesta guardada');await load();page='bets';render()}}
function openBetDeposit(id=''){const d=(state.betDeposits||[]).find(x=>x.id===id)||{date:today(),time:'',amount:'',note:'Ingreso de capital'};document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="betDepositModal"><form class="sheet" id="betDepositForm"><header><h2>${id?'Editar ingreso':'Ingresar capital para apuestas'}</h2><button type="button" class="icon" onclick="$('#betDepositModal').remove()">✕</button></header><div class="betFormGrid"><label>Importe<input name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" required value="${d.amount}"></label><label>Fecha<input name="date" type="date" required value="${d.date}"></label><label>Hora<input name="time" type="time" value="${d.time||''}"></label><label class="full">Concepto<input name="note" value="${esc(d.note||'')}"></label></div><button class="primary">Guardar ingreso</button></form></div>`);$('#betDepositForm').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.id=id||uid();o.amount=Number(o.amount);await put('betDeposits',o);$('#betDepositModal').remove();toast('Capital de apuestas actualizado');await load();page='bets';render()}}
async function deleteBet(id){if(confirm('¿Eliminar esta apuesta? Se recalculará el beneficio.')){await del('bets',id);toast('Apuesta eliminada');load()}}
async function deleteBetDeposit(id){if(confirm('¿Eliminar este ingreso de capital?')){await del('betDeposits',id);toast('Ingreso eliminado');load()}}
function drawBetProfit(c){const {x,w,h}=ctx(c),now=new Date(),rows=Array.from({length:12},(_,i)=>{const d=new Date(now.getFullYear(),now.getMonth()-11+i,1),k=d.toISOString().slice(0,7),v=(state.bets||[]).filter(b=>b.date.startsWith(k)&&b.result!=='Pendiente').reduce((a,b)=>a+betGain(b),0);return{l:d.toLocaleDateString('es-ES',{month:'short'}),v}}),max=Math.max(1,...rows.map(r=>Math.abs(r.v))),zero=h/2,slot=(w-40)/12,bw=Math.max(5,Math.min(22,slot*.6));x.strokeStyle='#aaa';x.beginPath();x.moveTo(25,zero);x.lineTo(w-5,zero);x.stroke();rows.forEach((r,i)=>{const px=28+i*slot,bh=Math.abs(r.v)/max*(h/2-34);x.fillStyle=r.v>=0?'#10b981':'#ef4444';x.fillRect(px,r.v>=0?zero-bh:zero,bw,bh);x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--muted');x.font='9px system-ui';if(i%2===0)x.fillText(r.l,px,h-8)})}
function drawBetResults(c){const {x,w,h}=ctx(c),labels=['Gan.','Perd.','Nulas','Pend.'],values=['Ganada','Perdida','Nula','Pendiente'].map(r=>(state.bets||[]).filter(b=>b.result===r).length),colors=['#10b981','#ef4444','#94a3b8','#f59e0b'],max=Math.max(1,...values),slot=(w-36)/4,bw=Math.min(45,slot*.55);values.forEach((v,i)=>{const bh=v/max*(h-55),px=25+i*slot;x.fillStyle=colors[i];x.fillRect(px,h-28-bh,bw,bh);x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--muted');x.fillText(labels[i],px,h-9)})}
function exportBetsCSV(){const rows=[['Fecha','Hora','Deporte','Competición','Evento','Mercado','Selección','Cuota','Importe','Resultado','Beneficio','Casa','Tipo'],...(state.bets||[]).map(b=>[b.date,b.time,b.sport,b.competition,b.event,b.market,b.selection,b.odds,b.stake,b.result,betGain(b),b.book,b.betType])],q=x=>`"${String(x??'').replaceAll('"','""')}"`;download('mis-apuestas.csv','\ufeff'+rows.map(r=>r.map(q).join(';')).join('\n'),'text/csv;charset=utf-8')}

// Capturas de apuestas y OCR local en el navegador mediante Tesseract.js.
let ocrBusy=false,ocrProgress=0;
function fileToDataURL(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)})}
function compressShot(data){return new Promise((ok,no)=>{const img=new Image();img.onload=()=>{const max=1800,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.87))};img.onerror=no;img.src=data})}
async function addBetShots(files){for(const f of [...files].filter(x=>x.type.startsWith('image/'))){try{const data=await compressShot(await fileToDataURL(f));await put('betShots',{id:uid(),name:f.name,type:f.type,size:f.size,createdAt:new Date().toISOString(),status:'Pendiente',progress:0,data,ocrText:'',draft:null})}catch(e){toast('No se pudo guardar '+f.name)}}await load();page='bets';betTab='shots';render()}
function betShotsView(){const shots=[...(state.betShots||[])].sort((a,b)=>b.createdAt.localeCompare(a.createdAt));$('#betView').innerHTML=`<section class="card"><h3>Capturas de apuestas</h3><div class="ocrInfo"><strong>Análisis OCR con revisión:</strong> la aplicación extrae texto de la captura, propone los campos y exige que revises la apuesta antes de guardarla. La primera ejecución necesita conexión para cargar el motor OCR.</div><div class="shotDrop" id="shotDrop"><b>Arrastra, pega o selecciona capturas</b><p class="muted">PNG, JPG o WebP. La imagen queda guardada en IndexedDB.</p><button onclick="$('#shotFile').click()">Seleccionar capturas</button><input id="shotFile" type="file" accept="image/*" multiple></div><div class="visionNotice">Consejo: usa capturas nítidas, sin recortes del importe, cuota, evento y resultado.</div><div class="shotGrid">${shots.length?shots.map(shotCard).join(''):'<p class="empty">Todavía no hay capturas.</p>'}</div></section>`;const input=$('#shotFile'),drop=$('#shotDrop');input.onchange=e=>addBetShots(e.target.files);['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('drag')}));drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');addBetShots(e.dataTransfer.files)}}
function shotCard(s){return `<article class="shotCard"><img class="shotThumb" src="${s.data}" alt="Captura de apuesta"><div class="shotBody"><b>${esc(s.name)}</b><div><span class="shotStatus ${s.status==='Analizada'?'ok':s.status==='Error'?'error':''}">${s.status}</span></div>${s.status==='Analizando'?`<div class="shotProgress"><i style="width:${s.progress||0}%"></i></div>`:''}${s.ocrText?`<details><summary>Texto detectado</summary><div class="ocrText">${esc(s.ocrText)}</div></details>`:''}<div class="ocrActions"><button onclick="previewBetShot('${s.id}')">Ver</button><button class="primary" ${ocrBusy?'disabled':''} onclick="analyzeBetShot('${s.id}')">${s.ocrText?'Reanalizar':'Analizar'}</button>${s.draft?`<button onclick="reviewBetShot('${s.id}')">Revisar y añadir</button>`:''}<button class="danger" onclick="deleteBetShot('${s.id}')">Eliminar</button></div></div></article>`}
function loadTesseract(){return new Promise((ok,no)=>{if(window.Tesseract)return ok(window.Tesseract);const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';sc.onload=()=>ok(window.Tesseract);sc.onerror=()=>no(Error('No se pudo cargar el motor OCR. Comprueba la conexión.'));document.head.appendChild(sc)})}
async function analyzeBetShot(id){if(ocrBusy)return;ocrBusy=true;let shot=(state.betShots||[]).find(x=>x.id===id);if(!shot)return;try{shot={...shot,status:'Analizando',progress:1};await put('betShots',shot);await load();page='bets';betTab='shots';render();const T=await loadTesseract(),worker=await T.createWorker('spa+eng',1,{logger:async m=>{if(m.status==='recognizing text'){shot.progress=Math.round((m.progress||0)*100);await put('betShots',shot);const bar=document.querySelector('.shotProgress i');if(bar)bar.style.width=shot.progress+'%'}});const result=await worker.recognize(shot.data);await worker.terminate();const text=result.data.text||'',draft=parseBetOCR(text);shot={...shot,status:'Analizada',progress:100,ocrText:text,draft,confidence:result.data.confidence||0,analyzedAt:new Date().toISOString()};await put('betShots',shot);toast('Captura analizada');await load();page='bets';betTab='shots';render();reviewBetShot(id)}catch(e){shot={...shot,status:'Error',error:String(e.message||e)};await put('betShots',shot);toast('Error OCR: '+shot.error);await load();page='bets';betTab='shots';render()}finally{ocrBusy=false}}
function parseBetOCR(text){const raw=String(text||''),lines=raw.split(/\n+/).map(x=>x.trim()).filter(Boolean),lower=raw.toLowerCase(),moneyNums=[...raw.matchAll(/(?:€|eur)?\s*(\d{1,5}(?:[.,]\d{1,2})?)\s*(?:€|eur)?/gi)].map(m=>Number(m[1].replace(',','.'))).filter(n=>n>0),oddsMatches=[...raw.matchAll(/(?:cuota|odds?)\s*[:\-]?\s*(\d+(?:[.,]\d+)?)/gi)],stakeMatches=[...raw.matchAll(/(?:stake|importe|apostado|apuesta)\s*[:\-]?\s*(\d+(?:[.,]\d+)?)/gi)],dateMatch=raw.match(/(20\d{2})[\/-](\d{1,2})[\/-](\d{1,2})/)||raw.match(/(\d{1,2})[\/-](\d{1,2})[\/-](20\d{2})/),timeMatch=raw.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);let date=today();if(dateMatch){if(dateMatch[1].length===4)date=`${dateMatch[1]}-${String(dateMatch[2]).padStart(2,'0')}-${String(dateMatch[3]).padStart(2,'0')}`;else date=`${dateMatch[3]}-${String(dateMatch[2]).padStart(2,'0')}-${String(dateMatch[1]).padStart(2,'0')}`};const knownSports=['fútbol','football','tenis','basket','baloncesto','hockey','béisbol','baseball','voleibol','handball','esports','mma','boxeo'],sport=knownSports.find(x=>lower.includes(x))||'',result=lower.includes('ganada')||lower.includes('ganador')?'Ganada':lower.includes('perdida')||lower.includes('perdedor')?'Perdida':lower.includes('nula')?'Nula':'Pendiente',odds=oddsMatches.length?Number(oddsMatches[0][1].replace(',','.')):(moneyNums.find(n=>n>=1.01&&n<=100)||''),stake=stakeMatches.length?Number(stakeMatches[0][1].replace(',','.')):'';const noise=/cuota|stake|importe|apostado|saldo|retorno|beneficio|ganada|perdida|pendiente|nula|€|eur/i,event=lines.find(x=>x.length>5&&!noise.test(x)&&!/^\d+[.,]?\d*$/.test(x))||'';return{date,time:timeMatch?`${String(timeMatch[1]).padStart(2,'0')}:${timeMatch[2]}`:'',sport,event,competition:'',market:lines.find(x=>/mercado|ganador|más de|menos de|ambos/i.test(x))||'',selection:'',odds,stake,result,book:'',betType:lower.includes('combinada')||lower.includes('múltiple')?'Múltiple':'Simple',notes:'Extraído por OCR. Revisar antes de guardar.'}}
function reviewBetShot(id){const s=(state.betShots||[]).find(x=>x.id===id);if(!s?.draft)return;openBetForm();const f=$('#betForm');Object.entries(s.draft).forEach(([k,v])=>{const el=f.elements[k];if(el)el.value=v});f.dataset.shotId=id;f.querySelector('h2').textContent='Revisar apuesta detectada';const old=f.onsubmit;f.onsubmit=async e=>{await old(e);const fresh=(await all('betShots')).find(x=>x.id===id);if(fresh)await put('betShots',{...fresh,status:'Adjuntada',attachedAt:new Date().toISOString()})}}
function previewBetShot(id){const s=(state.betShots||[]).find(x=>x.id===id);document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="shotPreviewModal"><div class="sheet"><header><h2>${esc(s.name)}</h2><button class="icon" onclick="$('#shotPreviewModal').remove()">✕</button></header><img class="shotPreview" src="${s.data}" alt="Captura ampliada">${s.ocrText?`<div class="ocrText">${esc(s.ocrText)}</div>`:''}</div></div>`)}
async function deleteBetShot(id){if(confirm('¿Eliminar esta captura y su análisis?')){await del('betShots',id);toast('Captura eliminada');load()}}
document.addEventListener('paste',e=>{if(page!=='bets'||betTab!=='shots')return;const files=[...e.clipboardData.items].filter(i=>i.type.startsWith('image/')).map(i=>i.getAsFile());if(files.length)addBetShots(files)});
</script></body></html>
