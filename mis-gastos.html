<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;--bg:#f3f7f6;--card:#fff;--text:#16211f;--muted:#6b7d79;--line:#e1ebe8;--brand:#0f766e;--soft:#e5f4f1;--red:#dc2626;--green:#059669}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}.shell{min-height:100vh}.side{position:fixed;width:225px;inset:0 auto 0 0;background:#0b2925;color:#fff;padding:24px 16px}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;margin:0 8px 27px}.brand i{font-style:normal;background:#1f9c90;width:40px;height:40px;border-radius:13px;display:grid;place-items:center}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#b9cfca;padding:12px;border-radius:12px;text-align:left}.nav button.on,.nav button:hover{background:#17453f;color:#fff}.main{margin-left:225px;padding:25px 4vw 70px;max-width:1450px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.head h1{margin:3px 0;font-size:29px}.head small,.muted{color:var(--muted)}.avatar{border:0;border-radius:50%;background:var(--soft);color:var(--brand);width:44px;height:44px;font-weight:800}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:19px;box-shadow:0 8px 24px #173b3510;padding:19px}.metric{display:grid;gap:7px;border-left:5px solid var(--c)}.metric strong{font-size:24px}.green{--c:#10b981}.red{--c:#ef4444}.blue{--c:#3b82f6}.purple{--c:#8b5cf6}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px}.chart canvas{width:100%;height:260px}.chart h3,.card h3{margin-top:0}.progress{height:9px;border-radius:99px;background:#e5ecea;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:var(--brand)}.tools{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:9px;margin-bottom:13px}input,select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:12px;outline:none}input:focus,select:focus,textarea:focus{border-color:#2aa69b;box-shadow:0 0 0 3px #2aa69b20}.list{padding:6px 16px}.row{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:11px;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line)}.row:last-child{border:0}.ico{width:43px;height:43px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:20px}.row div{display:grid;gap:3px}.row small{color:var(--muted)}.expense{color:var(--red)}.income{color:var(--green)}.icon{border:0;background:transparent;border-radius:9px;padding:8px}.danger{color:var(--red)}.primary{background:var(--brand);color:#fff;border:0;border-radius:11px;padding:13px 18px;font-weight:750}.actions{display:flex;flex-wrap:wrap;gap:9px}.actions button{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:12px}.budgetGrid,.goalGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.inline{display:flex;gap:9px;margin-top:10px}.calendar{padding:10px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr)}.week b{text-align:center;padding:7px;color:var(--muted)}.days button,.days>i{min-height:75px;background:var(--card);border:1px solid var(--line);padding:6px;display:flex;flex-direction:column;position:relative}.days button.sel{background:var(--soft);border-color:var(--brand)}.days small{font-size:10px;color:var(--red)}.days em{position:absolute;right:4px;top:4px;background:var(--brand);color:#fff;border-radius:8px;padding:1px 5px;font-size:9px}.settings{display:grid;gap:14px}.modal{position:fixed;inset:0;background:#061b18b8;z-index:30;display:grid;place-items:center;padding:15px}.sheet{background:var(--card);border-radius:22px;padding:21px;width:min(620px,100%);max-height:94vh;overflow:auto;display:grid;gap:14px}.sheet header{display:flex;justify-content:space-between}.sheet h2{margin:0}.sheet label{display:grid;gap:6px;font-size:14px;font-weight:650}.amount input{font-size:32px;font-weight:800}.form2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none!important}.toast{position:fixed;z-index:40;left:50%;bottom:25px;transform:translateX(-50%);background:#123b36;color:#fff;padding:12px 19px;border-radius:99px}.bottom{display:none}.empty{text-align:center;color:var(--muted);padding:25px}.warn{border-color:#f59e0b}.over{border-color:#ef4444}.topAction{margin-bottom:13px}

@media(max-width:820px){.side{display:none}.main{margin:0;padding:16px 13px 100px}.cards{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.tools{grid-template-columns:1fr 1fr}.tools input{grid-column:1/-1}.budgetGrid,.goalGrid{grid-template-columns:1fr}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;inset:auto 0 0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:7px 5px calc(7px + env(safe-area-inset-bottom))}.bottom button{border:0;background:transparent;color:var(--muted);display:grid;gap:2px;place-items:center;font-size:10px}.bottom button:nth-child(3){background:var(--brand);color:#fff;width:56px;height:56px;border-radius:50%;margin:-25px auto 0;font-size:27px}.sheet{position:absolute;bottom:0;border-radius:22px 22px 0 0}.modal{padding:0}.row{grid-template-columns:auto 1fr auto}.row .icon{grid-row:2}.days button,.days>i{min-height:55px}.days small{display:none}.toast{bottom:90px}}@media(max-width:460px){.metric{padding:14px}.metric strong{font-size:19px}.tools{grid-template-columns:1fr}.tools input{grid-column:auto}.form2{grid-template-columns:1fr}.row b{font-size:12px}}

<body><div id="app"></div>
<script>
'use strict';
const CEXP=[['home','Vivienda','🏠','#6366f1'],['food','Alimentación','🛒','#10b981'],['transport','Transporte','🚗','#3b82f6'],['restaurant','Restaurantes','🍔','#f97316'],['leisure','Ocio','🎮','#8b5cf6'],['shopping','Compras','🛍️','#ec4899'],['health','Salud','💊','#ef4444'],['travel','Viajes','✈️','#06b6d4'],['subscriptions','Suscripciones','📱','#64748b'],['bills','Facturas','💡','#eab308'],['sport','Deporte','⚽','#22c55e'],['gifts','Regalos','🎁','#d946ef'],['education','Educación','📚','#0ea5e9'],['other','Otros','📦','#78716c']].map(x=>({id:x[0],name:x[1],icon:x[2],color:x[3],type:'expense'}));
const CINC=[['salary','Nómina','💼','#10b981'],['extra','Extra','✨','#22c55e'],['sale','Venta','🏷️','#14b8a6'],['investment','Inversión','📈','#06b6d4'],['gift-income','Regalo','🎁','#84cc16'],['other-income','Otros','💰','#65a30d']].map(x=>({id:x[0],name:x[1],icon:x[2],color:x[3],type:'income'}));
const STORES=['transactions','categories','budgets','recurring','goals','settings'];let DB,state,page='home',selectedDay='';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],uid=()=>crypto.randomUUID(),money=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:state?.settings?.currency||'EUR'}).format(Number(n)||0),today=()=>new Date().toISOString().slice(0,10);
function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open('mis-gastos-single',1);r.onupgradeneeded=()=>{const d=r.result;STORES.forEach(s=>!d.objectStoreNames.contains(s)&&d.createObjectStore(s,{keyPath:s==='settings'?'key':'id'}))};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function req(r){return new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function all(s){return req(DB.transaction(s).objectStore(s).getAll())}async function put(s,v){await req(DB.transaction(s,'readwrite').objectStore(s).put(v))}async function del(s,k){await req(DB.transaction(s,'readwrite').objectStore(s).delete(k))}async function clear(s){await req(DB.transaction(s,'readwrite').objectStore(s).clear())}
async function load(){const [transactions,categories,budgets,recurring,goals,sets]=await Promise.all(STORES.map(all));state={transactions,categories,budgets,recurring,goals,settings:sets.find(x=>x.key==='app')?.value||{theme:'system',currency:'EUR',locale:'es-ES',demoLoaded:false}};await processRecurring();applyTheme();render()}
async function seed(){if((await all('categories')).length)return;for(const c of [...CEXP,...CINC])await put('categories',c);const ym=today().slice(0,8),demo=[['income',2000,'Nómina','salary',ym+'01'],['expense',700,'Alquiler','home',ym+'02'],['expense',86.4,'Compra semanal','food',ym+'05'],['expense',35,'Gimnasio','sport',ym+'07'],['expense',19.99,'Streaming','subscriptions',ym+'08']];for(const x of demo)await put('transactions',{id:uid(),type:x[0],amount:x[1],description:x[2],categoryId:x[3],date:x[4],createdAt:new Date().toISOString(),demo:true});await put('settings',{key:'app',value:{theme:'system',currency:'EUR',locale:'es-ES',demoLoaded:true}})}
async function processRecurring(){let changed=false;for(const r of state.recurring.filter(x=>x.active)){let d=new Date((r.lastGenerated||r.startDate)+'T12:00');if(r.lastGenerated)advance(d,r.frequency);while(d<=new Date()){const date=d.toISOString().slice(0,10),id=`rec-${r.id}-${date}`;if(!state.transactions.some(t=>t.id===id)){const t={id,type:r.type,amount:r.amount,description:r.description,categoryId:r.categoryId,date,paymentMethod:r.paymentMethod,notes:r.notes,recurringId:r.id,createdAt:new Date().toISOString()};await put('transactions',t);state.transactions.push(t);changed=true}r.lastGenerated=date;advance(d,r.frequency)}await put('recurring',r)}if(changed)state.transactions=await all('transactions')}function advance(d,f){if(f==='daily')d.setDate(d.getDate()+1);if(f==='weekly')d.setDate(d.getDate()+7);if(f==='monthly')d.setMonth(d.getMonth()+1);if(f==='yearly')d.setFullYear(d.getFullYear()+1)}
function nav(p){page=p;render()}function title(){return({home:'Resumen',movements:'Movimientos',budgets:'Presupuestos',calendar:'Calendario',recurring:'Recurrentes',goals:'Objetivos',stats:'Estadísticas',settings:'Configuración'})[page]}
function render(){const date=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});document.getElementById('app').innerHTML=`<div class="shell"><aside class="side"><div class="brand"><i>€</i>Mis Gastos</div><nav class="nav">${navs()}</nav></aside><main class="main"><header class="head"><div><small>${date}</small><h1>${title()}</h1></div><button class="avatar">MM</button></header><div id="view"></div></main><nav class="bottom"><button onclick="nav('home')">🏠<span>Inicio</span></button><button onclick="nav('movements')">💳<span>Movimientos</span></button><button onclick="openForm('expense')">＋</button><button onclick="nav('stats')">📊<span>Estadísticas</span></button><button onclick="nav('settings')">⚙️<span>Ajustes</span></button></nav></div>`;const fn={home:homeView,movements:movementsView,budgets:budgetsView,calendar:calendarView,recurring:recurringView,goals:goalsView,stats:statsView,settings:settingsView}[page];fn()}
function navs(){return [['home','🏠 Inicio'],['movements','💳 Movimientos'],['budgets','🐷 Presupuestos'],['calendar','📅 Calendario'],['recurring','🔁 Recurrentes'],['goals','🎯 Objetivos'],['stats','📊 Estadísticas'],['settings','⚙️ Configuración']].map(x=>`<button class="${page===x[0]?'on':''}" onclick="nav('${x[0]}')">${x[1]}</button>`).join('')}
function homeView(){const ym=today().slice(0,7),xs=state.transactions.filter(t=>t.date.startsWith(ym)),inc=sum(xs,'income'),exp=sum(xs,'expense'),bud=state.budgets.find(b=>b.month===ym&&!b.categoryId)?.amount||0,pct=bud?Math.round(exp/bud*100):0;$('#view').innerHTML=`<div class="cards">${metric('Ingresos',inc,'green')}${metric('Gastos',exp,'red')}${metric('Disponible',inc-exp,'blue')}${metric('Presupuesto',bud,'purple',bud?pct+'% utilizado':'Sin configurar')}</div>${bud?`<section class="card" style="margin-top:15px"><b>${money(Math.max(0,bud-exp))} restantes</b><div class="progress"><i style="width:${Math.min(100,pct)}%"></i></div></section>`:''}<div class="grid2"><section class="card chart"><h3>Gastos por categoría</h3><canvas id="donut"></canvas><div id="legend"></div></section><section class="card chart"><h3>Evolución diaria</h3><canvas id="line"></canvas></section></div><section class="card chart" style="margin-top:15px"><h3>Ingresos vs gastos · últimos 4 meses</h3><canvas id="bars"></canvas></section>`;drawCharts(xs)}function metric(l,v,c,s=''){return `<section class="card metric ${c}"><span class="muted">${l}</span><strong>${money(v)}</strong><small>${s}</small></section>`}function sum(xs,type){return xs.filter(x=>x.type===type).reduce((a,b)=>a+Number(b.amount),0)}
function drawCharts(monthTx){drawDonut($('#donut'),monthTx);drawLine($('#line'),monthTx);drawBars($('#bars'))}function ctx(c){const d=devicePixelRatio||1,w=c.clientWidth,h=260;c.width=w*d;c.height=h*d;const x=c.getContext('2d');x.scale(d,d);x.clearRect(0,0,w,h);return{x,w,h}}function drawDonut(c,xs){const {x,w}=ctx(c),vals=state.categories.filter(c=>c.type==='expense').map(c=>({...c,v:xs.filter(t=>t.type==='expense'&&t.categoryId===c.id).reduce((a,b)=>a+b.amount,0)})).filter(x=>x.v),total=vals.reduce((a,b)=>a+b.v,0);if(!total){x.fillStyle='#78908b';x.fillText('Sin gastos',w/2-30,130);return}let a=-Math.PI/2;vals.forEach(v=>{const z=v.v/total*Math.PI*2;x.beginPath();x.arc(w/2,120,82,a,a+z);x.arc(w/2,120,48,a+z,a,true);x.fillStyle=v.color;x.fill();a+=z});x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text');x.textAlign='center';x.font='700 18px system-ui';x.fillText(money(total),w/2,126);$('#legend').innerHTML=vals.map(v=>`<small style="margin:5px;display:inline-block"><b style="color:${v.color}">●</b> ${v.icon} ${v.name} ${money(v.v)}</small>`).join('')}function drawLine(c,xs){const {x,w,h}=ctx(c),v=Array.from({length:31},(_,i)=>xs.filter(t=>t.type==='expense'&&+t.date.slice(8)===i+1).reduce((a,b)=>a+b.amount,0)),max=Math.max(...v,1);x.strokeStyle='#d5dfdc';for(let i=0;i<5;i++){let y=20+i*50;x.beginPath();x.moveTo(28,y);x.lineTo(w-10,y);x.stroke()}x.strokeStyle='#0f766e';x.lineWidth=3;x.beginPath();v.forEach((n,i)=>{let px=28+i*(w-45)/30,py=h-30-n/max*(h-55);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}function drawBars(c){const {x,w,h}=ctx(c),now=new Date(),rows=Array.from({length:4},(_,i)=>{const d=new Date(now.getFullYear(),now.getMonth()-3+i,1),k=d.toISOString().slice(0,7),z=state.transactions.filter(t=>t.date.startsWith(k));return{l:d.toLocaleDateString('es-ES',{month:'short'}),i:sum(z,'income'),e:sum(z,'expense')}}),max=Math.max(...rows.flatMap(r=>[r.i,r.e]),1),slot=(w-45)/4;rows.forEach((r,i)=>{const base=25+i*slot,bw=Math.min(28,slot/4);x.fillStyle='#10b981';x.fillRect(base,h-30-r.i/max*(h-55),bw,r.i/max*(h-55));x.fillStyle='#ef4444';x.fillRect(base+bw+4,h-30-r.e/max*(h-55),bw,r.e/max*(h-55));x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--muted');x.fillText(r.l,base,h-10)})}
function movementsView(){viewMovements()}function viewMovements(){const q=$('#q')?.value||'',typ=$('#typ')?.value||'all',cat=$('#cat')?.value||'all',order=$('#order')?.value||'date-desc';let xs=state.transactions.filter(t=>(typ==='all'||t.type===typ)&&(cat==='all'||t.categoryId===cat)&&t.description.toLowerCase().includes(q.toLowerCase()));xs.sort((a,b)=>order==='amount-desc'?b.amount-a.amount:order==='amount-asc'?a.amount-b.amount:order==='date-asc'?a.date.localeCompare(b.date):b.date.localeCompare(a.date));$('#view').innerHTML=`<div class="tools"><input id="q" value="${esc(q)}" placeholder="Buscar…"><select id="typ"><option value="all">Todos</option><option value="expense">Gastos</option><option value="income">Ingresos</option></select><select id="cat"><option value="all">Categorías</option>${state.categories.map(c=>`<option value="${c.id}">${c.icon} ${c.name}</option>`)}</select><select id="order"><option value="date-desc">Más recientes</option><option value="date-asc">Más antiguos</option><option value="amount-desc">Mayor importe</option><option value="amount-asc">Menor importe</option></select></div><section class="card list">${xs.length?xs.map(row).join(''):'<p class="empty">No hay movimientos.</p>'}</section>`;$('#typ').value=typ;$('#cat').value=cat;$('#order').value=order;['q','typ','cat','order'].forEach(id=>$('#'+id).oninput=viewMovements)}function row(t){const c=state.categories.find(c=>c.id===t.categoryId)||{};return `<article class="row"><span class="ico">${c.icon||'•'}</span><div><b>${esc(t.description)}</b><small>${c.name||''} · ${t.date}</small></div><b class="${t.type}">${t.type==='expense'?'-':'+'}${money(t.amount)}</b><button class="icon" onclick="openForm('${t.type}','${t.id}')">✏️</button><button class="icon danger" onclick="removeTx('${t.id}')">🗑️</button></article>`}async function removeTx(id){if(confirm('¿Eliminar este movimiento?')){await del('transactions',id);toast('Movimiento eliminado');load()}}
function openForm(type,id){const t=state.transactions.find(x=>x.id===id)||{type,date:today(),categoryId:state.categories.find(c=>c.type===type)?.id,paymentMethod:'Tarjeta'};document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><form class="sheet" id="txform"><header><h2>${id?'Editar':type==='expense'?'Añadir gasto':'Añadir ingreso'}</h2><button type="button" class="icon" onclick="$('#modal').remove()">✕</button></header><label class="amount">Importe<input required autofocus inputmode="decimal" type="number" step="0.01" min="0.01" name="amount" value="${t.amount||''}"></label><label>Descripción<input required name="description" value="${esc(t.description||'')}"></label><div class="form2"><label>Categoría<select name="categoryId">${state.categories.filter(c=>c.type===type).map(c=>`<option value="${c.id}" ${c.id===t.categoryId?'selected':''}>${c.icon} ${c.name}</option>`)}</select></label><label>Fecha<input required type="date" name="date" value="${t.date}"></label></div>${type==='expense'?`<div class="form2"><label>Método<select name="paymentMethod">${['Tarjeta','Efectivo','Transferencia','Bizum','Domiciliación','Otro'].map(x=>`<option ${x===t.paymentMethod?'selected':''}>${x}</option>`)}</select></label><label>Hora<input type="time" name="time" value="${t.time||''}"></label></div>`:''}<label>Notas<textarea name="notes">${esc(t.notes||'')}</textarea></label><button class="primary">Guardar</button></form></div>`);$('#txform').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.id=id||uid();o.type=type;o.amount=Number(o.amount);o.createdAt=t.createdAt||new Date().toISOString();await put('transactions',o);$('#modal').remove();toast('Movimiento guardado');load()}}
function budgetsView(){const ym=today().slice(0,7),ex=state.transactions.filter(t=>t.type==='expense'&&t.date.startsWith(ym)),general=state.budgets.find(b=>b.month===ym&&!b.categoryId);$('#view').innerHTML=`<section class="card"><h3>Presupuesto general</h3><div class="inline"><input id="general" type="number" value="${general?.amount||''}" placeholder="1500"><button class="primary" onclick="saveBudget()">Guardar</button></div></section><div class="budgetGrid" style="margin-top:13px">${state.categories.filter(c=>c.type==='expense').map(c=>{const s=ex.filter(t=>t.categoryId===c.id).reduce((a,b)=>a+b.amount,0),b=state.budgets.find(b=>b.month===ym&&b.categoryId===c.id),p=b?.amount?s/b.amount*100:0;return `<section class="card ${p>=100?'over':p>=80?'warn':''}"><b>${c.icon} ${c.name}</b><p>${money(s)} / ${money(b?.amount||0)}</p><div class="progress"><i style="width:${Math.min(100,p)}%;background:${c.color}"></i></div><div class="inline"><input id="b-${c.id}" type="number" value="${b?.amount||''}" placeholder="Presupuesto"><button onclick="saveBudget('${c.id}')">Guardar</button></div>${p>=100?'<small class="danger">Presupuesto superado</small>':p>=80?'<small class="danger">Cerca del límite</small>':''}</section>`}).join('')}</div>`}async function saveBudget(cat=''){const ym=today().slice(0,7),amount=Number($(cat?'#b-'+cat:'#general').value);await put('budgets',{id:cat?`${ym}-${cat}`:`general-${ym}`,month:ym,categoryId:cat||undefined,amount});toast('Presupuesto guardado');load()}
function calendarView(){const ym=$('#calmonth')?.value||today().slice(0,7),[y,m]=ym.split('-').map(Number),n=new Date(y,m,0).getDate(),off=new Date(y,m-1,1).getDay(),xs=state.transactions.filter(t=>t.date===selectedDay);$('#view').innerHTML=`<input id="calmonth" type="month" value="${ym}" style="width:auto;margin-bottom:12px"><section class="card calendar"><div class="week">${'DLMXJVS'.split('').map(x=>`<b>${x}</b>`).join('')}</div><div class="days">${'<i></i>'.repeat(off)}${Array.from({length:n},(_,i)=>{const d=`${ym}-${String(i+1).padStart(2,'0')}`,z=state.transactions.filter(t=>t.date===d),s=sum(z,'expense');return `<button class="${selectedDay===d?'sel':''}" onclick="selectedDay='${d}';calendarView()"><b>${i+1}</b>${s?`<small>${money(s)}</small>`:''}<em>${z.length||''}</em></button>`}).join('')}</div></section>${selectedDay?`<section class="card list" style="margin-top:13px"><h3>${selectedDay}</h3>${xs.map(row).join('')||'<p class="empty">Sin movimientos</p>'}</section>`:''}`;$('#calmonth').onchange=calendarView}
function recurringView(){$('#view').innerHTML=`<button class="primary topAction" onclick="addRecurring()">+ Nuevo recurrente</button><section class="card list">${state.recurring.map(r=>`<article class="row"><span class="ico">🔁</span><div><b>${esc(r.description)}</b><small>${r.frequency} · ${r.active?'Activo':'Pausado'}</small></div><b>${money(r.amount)}</b><button onclick="toggleRecurring('${r.id}')">${r.active?'Pausar':'Activar'}</button><button class="icon danger" onclick="removeItem('recurring','${r.id}')">🗑️</button></article>`).join('')||'<p class="empty">No hay gastos recurrentes.</p>'}</section>`}async function addRecurring(){const description=prompt('Descripción');if(!description)return;const amount=Number(prompt('Importe'));if(!amount)return;const frequency=prompt('Frecuencia: daily, weekly, monthly o yearly','monthly');if(!['daily','weekly','monthly','yearly'].includes(frequency))return alert('Frecuencia no válida');await put('recurring',{id:uid(),type:'expense',description,amount,categoryId:'subscriptions',startDate:today(),frequency,active:true});load()}async function toggleRecurring(id){const r=state.recurring.find(x=>x.id===id);await put('recurring',{...r,active:!r.active});load()}
function goalsView(){$('#view').innerHTML=`<button class="primary topAction" onclick="addGoal()">+ Nuevo objetivo</button><div class="goalGrid">${state.goals.map(g=>{const p=Math.min(100,g.saved/g.target*100);return `<section class="card"><button class="icon danger" style="float:right" onclick="removeItem('goals','${g.id}')">🗑️</button><h3>🎯 ${esc(g.name)}</h3><b>${money(g.saved)} de ${money(g.target)}</b><div class="progress"><i style="width:${p}%"></i></div><small>${money(g.target-g.saved)} restantes</small><div class="inline"><input id="g-${g.id}" type="number" placeholder="Añadir ahorro"><button onclick="saveGoal('${g.id}')">Añadir</button></div></section>`}).join('')||'<p class="empty">Crea tu primer objetivo.</p>'}</div>`}async function addGoal(){const name=prompt('Nombre del objetivo');if(!name)return;const target=Number(prompt('Importe objetivo'));if(target)await put('goals',{id:uid(),name,target,saved:0});load()}async function saveGoal(id){const g=state.goals.find(x=>x.id===id),v=Number($('#g-'+id).value);await put('goals',{...g,saved:Math.min(g.target,g.saved+v)});load()}async function removeItem(s,id){if(confirm('¿Eliminar este elemento?')){await del(s,id);load()}}
function statsView(){const r=$('#range')?.value||'month',d=new Date(),start=r==='year'?`${d.getFullYear()}-01-01`:r==='6m'?new Date(d.getFullYear(),d.getMonth()-5,1).toISOString().slice(0,10):r==='3m'?new Date(d.getFullYear(),d.getMonth()-2,1).toISOString().slice(0,10):new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10),xs=state.transactions.filter(t=>t.date>=start),ex=xs.filter(t=>t.type==='expense'),inc=sum(xs,'income'),exp=sum(xs,'expense'),top=state.categories.map(c=>({c,v:ex.filter(t=>t.categoryId===c.id).reduce((a,b)=>a+b.amount,0)})).sort((a,b)=>b.v-a.v)[0];$('#view').innerHTML=`<select id="range" style="width:auto;margin-bottom:13px"><option value="month">Este mes</option><option value="3m">Últimos 3 meses</option><option value="6m">Últimos 6 meses</option><option value="year">Este año</option></select><div class="cards">${metric('Gasto total',exp,'red')}${metric('Media diaria',exp/Math.max(1,new Set(ex.map(x=>x.date)).size),'purple')}${metric('Ingresos',inc,'green')}${metric('Balance',inc-exp,'blue')}</div><div class="cards" style="margin-top:14px"><section class="card"><span class="muted">Mayor gasto</span><h3>${money(ex.length?Math.max(...ex.map(x=>x.amount)):0)}</h3></section><section class="card"><span class="muted">Categoría principal</span><h3>${top?.v?top.c.icon+' '+top.c.name:'Sin datos'}</h3></section><section class="card"><span class="muted">Movimientos</span><h3>${xs.length}</h3></section></div><section class="card chart" style="margin-top:14px"><h3>Comparación mensual</h3><canvas id="bars"></canvas></section>`;$('#range').value=r;$('#range').onchange=statsView;drawBars($('#bars'))}
function settingsView(){$('#view').innerHTML=`<div class="settings"><section class="card"><h3>Apariencia</h3><label>Tema <select id="theme"><option value="system">Automático</option><option value="light">Claro</option><option value="dark">Oscuro</option></select></label></section><section class="card"><h3>Datos y copia de seguridad</h3><p class="muted">El JSON contiene movimientos, categorías, presupuestos, recurrentes, objetivos y preferencias.</p><div class="actions"><button onclick="exportJSON()">⬇️ Exportar backup JSON</button><button onclick="$('#importFile').click()">⬆️ Importar backup</button><button onclick="exportCSV()">📄 Exportar CSV</button>${state.settings.demoLoaded?'<button onclick="removeDemo()">Eliminar datos de demostración</button>':''}</div><input id="importFile" class="hidden" type="file" accept="application/json"></section><section class="card over"><h3>Zona de peligro</h3><p class="muted">Nunca se borran datos automáticamente.</p><button class="primary" style="background:#dc2626" onclick="wipe()">🗑️ Borrar todos los datos</button></section><section class="card"><b>Mis Gastos · HTML único</b><p class="muted">Todos los datos se almacenan localmente en IndexedDB.</p></section></div>`;$('#theme').value=state.settings.theme;$('#theme').onchange=async e=>{state.settings.theme=e.target.value;await put('settings',{key:'app',value:state.settings});applyTheme()};$('#importFile').onchange=importJSON}
function applyTheme(){const t=state?.settings?.theme||'system',dark=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.classList.toggle('dark',dark)}function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}function backup(){return{version:1,exportedAt:new Date().toISOString(),...state}}function exportJSON(){download(`mis-gastos-${today()}.json`,JSON.stringify(backup(),null,2),'application/json')}async function importJSON(e){try{const b=JSON.parse(await e.target.files[0].text());if(b.version!==1||!Array.isArray(b.transactions))throw 0;if(!confirm('Se sobrescribirán los datos actuales. ¿Continuar?'))return;for(const s of STORES)await clear(s);for(const s of STORES.filter(x=>x!=='settings'))for(const x of b[s]||[])await put(s,x);await put('settings',{key:'app',value:b.settings});toast('Copia restaurada');load()}catch{alert('Copia no válida')}}function exportCSV(){const q=x=>'"'+String(x??'').replaceAll('"','""')+'"',rows=[['Fecha','Tipo','Descripción','Categoría','Método','Importe','Notas'],...state.transactions.map(t=>[t.date,t.type,t.description,state.categories.find(c=>c.id===t.categoryId)?.name,t.paymentMethod,Number(t.amount).toFixed(2),t.notes])];download('mis-gastos.csv','\ufeff'+rows.map(r=>r.map(q).join(';')).join('\n'),'text/csv;charset=utf-8')}async function removeDemo(){for(const t of state.transactions.filter(x=>x.demo))await del('transactions',t.id);state.settings.demoLoaded=false;await put('settings',{key:'app',value:state.settings});load()}async function wipe(){if(confirm('¿Borrar TODOS los datos?')&&confirm('Confirmación final: no se puede deshacer.')){for(const s of STORES)await clear(s);location.reload()}}function toast(s){document.body.insertAdjacentHTML('beforeend',`<div class="toast">✓ ${s}</div>`);setTimeout(()=>$('.toast')?.remove(),2200)}function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
(async()=>{DB=await openDB();await seed();await load()})();
</script></body></html>
